<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whimsical Egg Timer</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&display=swap" rel="stylesheet">
</head>
<body>

    <div class="sketchbook">
        <header>
            <div class="color-picker">
                <div class="color-dot color-white" onclick="changeColor('#fefcf5')"></div>
                <div class="color-dot color-blue" onclick="changeColor('#e3f2fd')"></div>
                <div class="color-dot color-pink" onclick="changeColor('#fce4ec')"></div>
                <div class="color-dot color-green" onclick="changeColor('#e8f5e9')"></div>
            </div>
            <h1 id="main-title" onclick="checkSecret()">Pick your perfect egg!</h1>
        </header>

        <div id="kevin-surprise" class="kevin-hidden">
            <h2>KEVIN'S FAMOUS CHILI</h2>
            <img src="assets/images/kevin.gif" alt="Kevin Spills Chili">
            <p id="kevin-quote">The trick is to undercook the onions.</p>
            <button class="btn-kevin" onclick="hideSecret()">EGG IS BETTER</button>
        </div>

        <main id="egg-selection">
            <div class="egg-card" onclick="startTimer(360, 'Sleeping Softly', 'assets/images/soft.png')">
                <img src="assets/images/soft.png" alt="Sleepy Soft Egg">
                <h2>Soft (6 min)</h2>
                <p>A runny embrace.</p>
            </div>
            
            <div class="egg-card" onclick="startTimer(420, 'Jammy Dance', 'assets/images/jammy.png')">
                <img src="assets/images/jammy.png" alt="Happy Jammy Egg">
                <h2>Jammy (7 min)</h2>
                <p>Sticky, gooey joy.</p>
            </div>
            
            <div class="egg-card" onclick="startTimer(600, 'Properly Hard', 'assets/images/hard.png')">
                <img src="assets/images/hard.png" alt="Proper Hard Egg">
                <h2>Hard (10 min)</h2>
                <p>Fully set & ready.</p>
            </div>

            <div class="egg-card custom-input-card">
                <input type="number" id="custom-minutes" placeholder="?" min="1" max="60">
                <button onclick="startCustomTimer()">Custom Go!</button>
            </div>
        </main>

        <section id="timer-display" class="hidden">
            <h2 id="egg-type-title">Boiling...</h2>
            <img id="timer-egg-img" src="" alt="Cooking Egg" class="cooking-egg-img" onclick="getWisdom()">
            <div id="wisdom-box" class="wisdom-box hidden">
                <p id="kevin-wisdom-text"></p>
            </div>
            <div class="timer-circle">
                <span id="countdown-text">00:00</span>
            </div>
            <div id="fact-box" class="fact-box">
                <p id="egg-fact">Loading egg truth...</p>
            </div>
            <div class="timer-controls">
                <button id="pause-btn" class="btn-pause" onclick="togglePause()">Pause</button>
                <button class="btn-cancel" onclick="resetApp()">STOP!</button>
            </div>
        </section>

        <audio id="alarm-sound" src="assets/audio/End.mp3"></audio>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
